<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký ca mô phỏng - Supabase Bridge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">BACKEND API · SUPABASE DATABASE</p>
    <h1>Đăng ký ca thực hành mô phỏng</h1>
    <p>Thông tin đăng ký được gửi qua Backend API và lưu trực tiếp vào cơ sở dữ liệu Supabase.</p>
    
    <form id="requestForm">
      <label>
        Mã nhóm
        <input name="maNhom" required maxlength="50" placeholder="NHOM-01">
      </label>
      <label>
        Trạm mô phỏng
        <select name="tram">
          <option>Hồi sức cơ bản</option>
          <option>Tiêm truyền</option>
          <option>Giao tiếp người bệnh</option>
        </select>
      </label>
      <label>
        Ca học
        <select name="ca">
          <option>Sáng</option>
          <option>Chiều</option>
        </select>
      </label>
      <button type="submit" id="submitBtn">Gửi đăng ký</button>
      <p id="status" aria-live="polite"></p>
    </form>

    <section class="records-section">
      <div class="records-header">
        <h2>Danh sách đăng ký gần đây</h2>
        <button type="button" id="refreshBtn" class="secondary-btn">Làm mới</button>
      </div>
      <div class="table-container">
        <table id="recordsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Mã nhóm</th>
              <th>Trạm</th>
              <th>Ca</th>
              <th>Thời gian gửi</th>
            </tr>
          </thead>
          <tbody id="recordsBody">
            <tr>
              <td colspan="5" style="text-align: center; color: #627d98;">Đang tải danh sách...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
